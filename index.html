<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#244d3c" />
    <script>
      (function () {
        try {
          var a = JSON.parse(
            localStorage.getItem("recall-garden-preferences") || "{}",
          ).appearance;
          if (a !== "light" && a !== "dark") return;
          document.documentElement.setAttribute("data-theme", a);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m)
            m.setAttribute("content", a === "dark" ? "#1a2420" : "#244d3c");
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Play Recall Garden: match numbers from one, two, or three turns ago. Your practice stays in this browser."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recall Garden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Recall Garden — Number memory game</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
